[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pflab"
version = "0.0.1"
description = "Tax-aware monthly-SIP portfolio research harness for NSE equities"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "pyarrow>=14",
  "duckdb>=0.10",
  "requests>=2.31",
  "python-dateutil>=2.8",
  "yfinance>=0.2",
  "tomli>=2.0; python_version < '3.11'",
  # CLAUDE.md 7, added 2026-09-17 for the NSE index constituent-change
  # press releases (E1b §3). pdfplumber is the named fallback for releases
  # pypdf returns out of reading order, and is used for nothing else.
  "pypdf>=5",
  "pdfplumber>=0.11",
  # CLAUDE.md 7, installed 2026-09-29 for E5-A §5. Pinned exactly: a model's
  # bytes depend on the LightGBM that fitted it. Brings scipy and narwhals.
  "lightgbm==4.7.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
pflab = "pflab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
