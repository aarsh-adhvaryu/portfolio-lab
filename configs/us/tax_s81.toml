[[fact]]
id = "dividend_india_taxed_at_slab"
value = "slab"
unit = "a foreign dividend is 'income from other sources' taxed at the slab rate (no special rate); the sub-book uses the same slab as the rupee paper book (paper/book.py SLAB, 30%)"
fy = "2025-26 and 2026-27"
source_url = "https://www.winvesta.in/blog/investors/complete-guide-to-tax-on-us-stocks-for-indian-investors-2026"
source_title = "Winvesta: complete guide to tax on US stocks for Indian investors (2026); taxguru"
verification = "secondary"
verified_on = 2026-11-09

[[fact]]
id = "foreign_tax_credit_rule"
value = "credit = the LOWER of the US tax withheld (converted at the SBI TTBR of the last day of the month before it was withheld) and the Indian tax on that income; claimed with Form 67 (income to FY 2025-26) or Form 44 (from FY 2026-27), filed with the return"
fy = "credit principle: all (treaty Art. 25(2)(a)); Form 67 / Form 44: 2025-26 / 2026-27"
source_url = "https://www.irs.gov/pub/irs-trty/india.pdf"
source_title = "Treaty Article 25(2)(a); Income-tax Act 2025 s.159(4) (the Act applies where more beneficial)"
verification = "primary"
verified_on = 2026-11-09
verify = "the form numbers, the CA certificate at Rs 1 lakh of foreign tax and the due dates are secondary (taxguru, paasa): read the final Form 44 and rule 76"

