# S79b (overnight): one switch per item. on = false makes the item behave as not there (tools return {"off": true}, jobs skip).
# Each agent adds only its own [table].

# Item 17 (software): the two local seats, escalation, teacher log, cost per useful act. on=false: tools return {"off": true}, jobs skip, client.chat ignores "seat:" names.
[seats]
on = true
manage = false          # true: the seats_mode job loads/unloads seat models by mode (Ollama keep_alive; a llama-server only after every guard passes). false: it only records the plan.
teacher_log = true      # every cloud call's input/output kept (redacted) in teacher_log_s79 for later distillation (no training this session)
escalate_samples = 3    # local samples on a judgment call
escalate_min_confidence = 0.6
deep_pool = true        # deep_pool.py may use idle cores in deep mode

# Item 18B (blended benchmark and attribution) and 18E (verify corporate actions and top-ups on the system's own book).
[benchmark]
on = true
equity_series = "NIFTY500_TRI"     # data/indices: equity class = Nifty 500 total return
gold_series = "GOLD"                # data/global (COMEX gold, USD) x USDINR (data/macro): gold class in rupees (a rupee gold ETF also pays import duty and a premium: not in the proxy)
intl_series = "US_NASDAQ"           # data/global (price index, no dividends) x USDINR: international class in rupees
cash_assumed_rate = 0.065           # cash class = this annual rate when the futures-carry cash rate (data/riskfree) is not readable; otherwise that estimate
min_sessions = 2                    # no attribution before this many marked days

[verify_book]
on = true
apply_corporate_actions = true      # paper/corp.py applies splits, bonuses, dividends, ISIN changes and price-drop credits to the system's own ledger inside book.catch_up

# Item K (Kite): the logged-out question (job kite_token) and the minute-bar backfill. on=false: the job skips; the backfill tool still runs by hand.
[kite]
on = true

[provenance]   # item 18C: decision provenance and source credit (paper/provenance.py)
on = true
forecast_horizon_sessions = 20   # the forecast horizon recorded as "in force" for a decision (nearest available)
headline_horizon_days = 28       # the scoring horizon the scorecard lines read (7, 28, 84 or 182)
warning_days = 14                # a bear warning/debate this recent on the name counts as behind the decision
min_weight = 0.05                # a source below this weight is listed but not credited
min_n = 20                       # under this many credited decisions a row shows its count only
kg = true                        # write the credit into the knowledge graph (source -was_right_on / misled_on-> decision)
max_lines = 8

# [construct] was removed in A60: the optimiser was inconclusive (p 0.41), never adopted, and its code deleted (the study record stays: docs/protocols/s79_construct_protocol.md).

# Item 16 (the shared situation): typed claims per market, one synthesized report (NOW / WHY / SO WHAT / NEXT / ACT), chains to the graph, predictions scored at 1, 5 and 20 sessions.
# on=false: the tool returns {"off": true}, the job skips, the World panel shows nothing. No paid call is ever made here (the local THINKER only).
[situation]
on = true
model = true                # false: the report is always written by code from the claims (flagged coded only)
paper_requests = true       # ACT may put one request a day on the paper team's inputs
paper_requests_per_day = 1
questions = false           # ACT may ask the investor one question a day (always with a default and a deadline); off by default: the 8B model asks market questions, flip when the THINKER seat is better
questions_per_day = 1
short_intraday = true       # session mode: a short synthesis, flag-triggered or at most once in intraday_minutes
intraday_minutes = 90
max_watch = 12              # active watch triggers
kg = true                   # write chains and chain-type hit rates to the knowledge graph

[lens]
# item 18D: the plug-in lens interface (fcast/plugins.py). on = false: no lens is made, scored or weighted; the code forecasters and the hedge are as before.
on = true

[waves]
# item 15: macro attribution (tool macro_attribution, job macro_attribution). The wave / rotation flag, its tool, job and lens were deleted in A60 (their study found no
# follow-through); the section name stays for this one feature. on = false: the tool returns {"off": true}, the job skips.
on = true
backfill_sessions = 60     # macro_attribution: how many past sessions a first run writes (later runs write every session missed)

[studies]
# items 15/15b/7b: the pre-registered event studies, now only their record (quant/index_event_study.results, tool wave_studies, table wave_study_results_s79). on = false: the tool returns {"off": true}.
# The studies were run once and cannot be rerun; this switch only hides the verdicts from the agents.
on = true
