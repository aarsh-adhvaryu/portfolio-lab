# Period boundaries come from the charter (E1 §11). Configs may only
# reference a period by name; they cannot widen it.

[periods.warmup]
start = "2005-01-01"
end = "2006-12-31"
sealed = false

[periods.development]
start = "2007-01-01"
end = "2016-12-31"
sealed = false

[periods.validation]
start = "2017-01-01"
end = "2021-12-31"
sealed = false

[periods.sealed]
start = "2022-01-01"
end = "2025-12-31"
sealed = true

[periods.live]
start = "2026-10-01"
end = "2027-09-30"
sealed = false

# Charter E2-A §6, as amended 2026-09-25. Its own window, because the rule's
# INPUTS do not exist for most of E1's: the IBC came into force in December
# 2016, and SEBI's encumbrance and default disclosure regimes date from 2019.
# The charter declares this a low-power test; these names exist so a config
# can reference it without widening anything.
[periods.e2a_development]
start = "2017-01-01"
end = "2019-12-31"
sealed = false

[periods.e2a_validation]
start = "2020-01-01"
end = "2021-12-31"
sealed = false

# Charter E2-D1 §6 (2026-09-27). Development starts in 2010 because the
# shareholding backfill does: the BSE quarterly patterns begin with the March
# 2010 quarter. Validation is E1's own `validation` period, 2017-2021.
[periods.e2d1_development]
start = "2010-01-01"
end = "2016-12-31"
sealed = false
