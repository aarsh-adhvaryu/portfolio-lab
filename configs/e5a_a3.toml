[strategy]
id = "E5-A"
charter = "docs/strategies/E5-A.md"

# --- E5-A §7: THE ONE CHANGE ---------------------------------------------
# The composite of the three horizon models' percentile predictions over
# U(M) replaces the stack's ranking signal in E1 §4. Until §5's minimum
# training set exists, a decision falls back to the stack's own rank --
# E1d's volatility-scaled 6+12 score -- and records that it did.
signal = "precomputed"
fallback_signal = "vol_scaled_6_12"
skip_sessions = 21
score_order = "average_then_z"
score_windows = [126, 252]

# --- everything else is the stack's (E1 + E1d), unchanged ----------------
# Byte-for-byte the values in configs/e1d.toml.
lookback_sessions = 252
n_hold = 25
band_exit_rank = 50
max_buys_per_month = 6
sip_amount = 50000.0
initial_cash = 0.0
cash_rate_annual = 0.06
trend_filter = "sma10"          # sma10 | off | sell_to_cash
delisting = "last_close"        # last_close | total_loss
delist_confirm_sessions = 250

[hooks]
side_sleeve_capital = 0.0

[universe]
# E1's universe, E1d's too: top 500 by traded value. U(M) in §4 and §6.
mode = "turnover_top_n"
series = ["EQ"]
min_sessions = 250
top_n_by_turnover = 500
turnover_window = 126
min_price = 10.0
max_adv_fraction = 0.01

[stack]
# E5-A §7 [D 2], settled 2026-09-29: A0 is measured against E1 + E1d.
config = "configs/e1d.toml"

[e5a]
family = "A3"
# §6a, then §6(d), in this order (the model's column order). A family
# changes ONLY these columns (§3); everything else is A0's, byte for byte.
features = ["mom_1m",
            "mom_3m",
            "mom_6m",
            "mom_12_1",
            "vol_21",
            "vol_63",
            "vol_252",
            "tv_21_126",
            "tv_126_252",
            "dist_252_high",
            "stack_score",
            "beta_brent",
            "beta_brent_x_chg1",
            "beta_brent_x_chg3",
            "beta_usdinr",
            "beta_usdinr_x_chg1",
            "beta_usdinr_x_chg3",
            "beta_us10y",
            "beta_us10y_x_chg1",
            "beta_us10y_x_chg3",
            "beta_india_vix",
            "beta_india_vix_x_chg1",
            "beta_india_vix_x_chg3",
            "beta_fii",
            "beta_fii_x_chg1",
            "beta_fii_x_chg3",
            "beta_nifty500"]
horizons = [1, 3, 12]
refit = "annual"                # §5 [D 5]; S6 is "monthly"
refit_month = 12
min_cross_sections = 12         # §5: before this, the stack's own rank
seed = 20260927                 # §5; S5 is 20270927
num_threads = 1                 # §5: fixed thread count

[e5a.activation]
# §6 [D 6]: the family model is used from refit R only if, for every
# horizon, R's training set holds >= 36 month-end cross-sections with the
# family available for >= 50% of U(M). Until then the decisions are A0's.
min_cross_sections = 36
min_coverage = 0.5

[e5a.a3]
# §6(d): E2-B's five factors plus the Nifty 500 beta; 36 months, >= 24.
# Transforms and timing are build readings (exposure.py), for the lock.
window_months = 36
min_obs = 24

[e5a.fixed]
# §5 fixed: 300 trees, bagging 0.8 every iteration, feature fraction 0.8
num_iterations = 300
bagging_fraction = 0.8
bagging_freq = 1
feature_fraction = 0.8

[e5a.params]
# E5-A §5's tuned point, 2026-09-29, under §4 as locked (experiments/E5-A/
# tuning/e5a_exploratory-3d2c02ba01062121). S4 replaces all three with 15/500/0.03.
num_leaves = 7
min_data_in_leaf = 200
learning_rate = 0.02

[evaluation]
period = "e5a_development"
periods_path = "configs/evaluation_periods.toml"

[costs]
path = "configs/costs_zerodha.toml"
multiplier = 1.0

[tax]
path = "configs/tax_policy_in.toml"

[benchmarks]
primary = "NIFTY500_TRI"
list = ["NIFTY50_TRI", "NIFTY500_TRI", "NIFTY200_MOMENTUM30_TRI", "EQUAL_WEIGHT_UNIVERSE"]
mom30_expense_ratio = 0.003

[report]
output_dir = "experiments/E5-A/A3"
