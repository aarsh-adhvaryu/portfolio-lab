effective_from = 2024-07-23
stcg_rate = "slab"
section_old = "50AA"
section_new = "76(1), (2)(a), (5)(b)"
source_url = "https://egazette.gov.in/WriteReadData/2025/265620.pdf"
source_title = "Income-tax Act, 2025, s.76 (Gazette p.123): units of a Specified Mutual Fund acquired on or after 1-Apr-2023 are short-term capital gains; (5)(b) Specified Mutual Fund invests more than 65% in debt and money market instruments, or 65% or more in units of such a fund"
verification = "primary"
verified_on = 2026-10-06
note = "Specified MF (more than 65% debt and money market, definition from 1-Apr-2025) bought on or after 2023-04-01: gain is always short-term, at slab. Whether a given fund is specified rests on the AMFI category (instruments.tax_class_reason)."

