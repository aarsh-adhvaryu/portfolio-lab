# Annual exemption on 112A gains (equity with STT).
[[exemption]]
id = "ltcg_112a"
applies_to = "equity_stt_paid"
fy_from = 2025            # FY2024-25 (label = year the FY ends, as pflab.tax.india_lots.fy_of)
amount = 125000.0
section_old = "112A"
section_new = "198"
source_url = "https://pib.gov.in/PressReleasePage.aspx?PRID=2036604"
source_title = "CBDT FAQs on the new capital gains regime, Q7 (PIB, 24-Jul-2024)"
verification = "primary"
verified_on = 2026-10-06
note = "Rs 1,25,000 per FY for FY2024-25 and later, over all 112A gains of the year."

# Grandfathering of pre-2018 equity.
[[grandfather]]
id = "equity_31jan2018"
applies_to = "equity_stt_paid"
acquired_before = 2018-02-01
fmv_date = 2018-01-31
rule = "cost = max(actual cost, min(FMV on 2018-01-31, sale value))"
section_old = "55(2)(ac)"
section_new = "90(7), (8)"
source_url = "https://egazette.gov.in/WriteReadData/2025/265620.pdf"
source_title = "Income-tax Act, 2025, s.90(7)-(8) (Gazette pp.135-136): cost of acquisition of a long-term equity share, equity-oriented fund unit or business trust unit under s.198 acquired before 1-Feb-2018 is the higher of the actual cost and the lower of fair market value and the sale consideration"
verification = "primary"
verified_on = 2026-10-06
note = "FMV is the HIGHEST price quoted on the exchange on 31-Jan-2018 (or on the last earlier day it traded); for an unlisted-then fund unit, its NAV that day. The caller supplies it. Further limbs of s.90(8)(b) cover shares that were unlisted on 31-Jan-2018 and are not modelled."
