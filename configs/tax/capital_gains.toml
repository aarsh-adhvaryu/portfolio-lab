# Capital-gains rule rows, by TRANSFER date (S2, built 2026-10-06).
# Coverage starts 2024-07-23, the day the Finance (No. 2) Act 2024 regime took
# effect (PLAN §10 amendment A1, 2026-10-06). Earlier transfers raise RuleGap.
#
# Row fields: tax_class (pflab.pm.instruments labels), optional conditions
# (stt_paid, listed, acquired_from, acquired_to), lt_months (long-term if held
# MORE than this; absent = always short-term), stcg_rate / ltcg_rate (decimal
# or "slab"; ltcg_rate absent = no long-term), effective_from/effective_to
# (inclusive; absent effective_to = open), section_old (Income-tax Act 1961),
# section_new (Income-tax Act 2025, in force 2026-04-01), source_url,
# source_title, verification (primary | secondary | unverified), verified_on.
# `secondary` = a secondary source seen in a search result, primary text not
# opened; `unverified` = not checked this session. Both are listed as open in
# docs/PLAN.md §6.

[[rule]]
id = "equity_stt_paid"
tax_class = "EQUITY"
stt_paid = true
listed = true
lt_months = 12
stcg_rate = 0.20
ltcg_rate = 0.125
effective_from = 2024-07-23
section_old = "111A / 112A"
section_new = "196 / 198"
source_url = "https://pib.gov.in/PressReleasePage.aspx?PRID=2036604"
source_title = "CBDT FAQs on the new capital gains regime, Q3, Q6, Q7 (PIB, 24-Jul-2024)"
verification = "primary"
verified_on = 2026-10-06
note = "Listed equity, equity-oriented MF and equity ETF with STT paid. Section numbers 196/198 confirmed by Finance Act 2026 (No. 4 of 2026) First Schedule Part I-B, which cites s.196 (STCG 20%) and s.198 (LTCG 12.5% over Rs 1,25,000)."

