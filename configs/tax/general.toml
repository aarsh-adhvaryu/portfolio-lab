# Loss set-off and carry-forward.
[[loss_rule]]
id = "set_off_and_carry_forward"
short_term_loss_against = ["short_term_gain", "long_term_gain"]
long_term_loss_against = ["long_term_gain"]
carry_forward_years = 8
requires_timely_return = true   # not verified in the sections above
section_old = "70, 71, 74"
section_new = "108(2), 109(2), 111(1)-(2)"
source_url = "https://egazette.gov.in/WriteReadData/2025/265620.pdf"
source_title = "Income-tax Act, 2025, s.108(2) (short-term loss against any other capital asset, long-term loss against long-term only), s.109(2) (capital loss not against other heads), s.111(1)-(2) (carry forward, short-term against any other asset, long-term against long-term only, not beyond eight tax years) (Gazette pp.147-148)"
verification = "primary"
verified_on = 2026-10-06
note = "Matches pflab.tax.india_lots and tax.gains. Timely-return condition (carry forward only if the return is filed on time) is not in these sections as extracted: kept as a flag, unverified."

# Dividend TDS.
[[dividend_tds]]
id = "dividend_tds"
effective_from = 2026-04-01
rate = 0.10
threshold_per_payer_per_year = 10000.0
threshold_applies_to = "individual shareholder paid by any mode other than cash"
section_new = "393(1) Table Sl. 7; no-deduction Table Sl. 10(f)"
source_url = "https://egazette.gov.in/WriteReadData/2025/265620.pdf"
source_title = "Income-tax Act, 2025, s.393(1) Table Sl. 7 (dividend by a domestic company: 10%) and the no-deduction Table Sl. 10(f): individual shareholder, dividend paid other than in cash, aggregate not above Rs 10,000 in the tax year (Gazette pp.402-414)"
verification = "primary"
verified_on = 2026-10-06
note = "Replaces the unverified Finance Act 2026 reading of 2026-10-06 morning. PLAN §6 open item 4 resolved. The Act's words are the amount or aggregate of amounts of dividend paid in the tax year not exceeding Rs 10,000; deductors apply it per payer."
