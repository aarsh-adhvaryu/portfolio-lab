# Foreign (US) investing rows for the US sleeve (S64 Phase 6 item 1). Facts looked up on 2026-10-27, never from memory.
#
# Same vocabulary as the other files in this folder (tests/test_tax_rules.py checks every row):
#   verification = primary     the official page's own text was read
#                  secondary   an official page's wording seen in a search result, or Zerodha's own published guide (read in full);
#                              the primary page was not opened (or refused: the Income Tax Department answered 403). Listed as open in
#                              docs/PLAN.md section 6, as the capital-gains rows are.
#                  unverified  no source seen: tax/foreign.py REFUSES it, it is never used in a figure
#   source_kind  says which kind of secondary this is (official wording vs the broker's guide).
# Rates here are sourced inputs to ESTIMATES (the investor's actual tax depends on his total income and his adviser).

[[fact]]
id = "lrs_limit_usd"
value = 250000
unit = "USD per financial year (April-March), per person, across all remittances under LRS (not only investing)"
source_url = "https://www.rbi.org.in/commonman/english/Scripts/FAQs.aspx?Id=1834"
source_title = "RBI FAQ: Liberalised Remittance Scheme (LRS) limit"
broker_url = "https://support.zerodha.com/category/trading-and-markets/general-kite/global-investing/articles/global-investing-guide"
verification = "secondary"
source_kind = "official page, wording seen in search results (page itself not opened or refused)"
verified_on = 2026-10-27
note = "Above the limit needs RBI's prior permission. Tracked per PAN across banks."

[[fact]]
id = "tcs_lrs_threshold_inr"
value = 1000000
unit = "INR of LRS remittances in a financial year before TCS is collected (raised from 7 lakh effective 2025-04-01)"
source_url = "https://www.incometaxindia.gov.in/w/tcs-rates"
source_title = "Income Tax Department: TCS rates (206C(1G)); Brief on budget 2025"
