verified_on = 2026-10-06
note = "Residents aged 60+ with no business income need not pay advance tax (s.403(3)). The instalment dates are on or before the 15th of June, September, December, March."

# Resident individual: unused basic exemption absorbs special-rate gains.
[[special_rate_absorption]]
id = "basic_exemption_absorbs_special_gains"
effective_from = 2026-04-01
applies_to = ["196(2)", "197(2)", "198(3)"]
section_new = "196(2), 197(2), 198(3)"
source_url = "https://egazette.gov.in/WriteReadData/2025/265620.pdf"
source_title = "Income-tax Act, 2025, ss.196(2), 197(2), 198(3) (Gazette pp.221-223)"
verification = "primary"
verified_on = 2026-10-06
note = "For a resident individual or HUF, where total income excluding the gain is below the maximum amount not chargeable to tax, the gain is reduced by the shortfall before the rate is applied (s.198(3): before the Rs 1,25,000 threshold). PLAN §6 open item 5 resolved. The Act does not say in which order the shortfall is spread over 196 / 197 / 198 gains: the calculator uses the tax-minimising order and says so."
