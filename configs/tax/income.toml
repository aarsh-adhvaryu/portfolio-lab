# Rebate (old 87A, now s.156), resident individuals.
[[rebate]]
id = "rebate_new_regime"
regime = "new"
effective_from = 2026-04-01
income_limit = 1200000.0
max_rebate = 60000.0
section_new = "156(2), (3)"
source_url = "https://egazette.gov.in/WriteReadData/2025/265620.pdf"
source_title = "Income-tax Act, 2025, s.156(2)-(3) (Gazette p.186)"
verification = "primary"
verified_on = 2026-10-06
text = "(2) ... chargeable to tax under section 202(1) ... (a) the income does not exceed twelve lakh rupees, 100% of the income-tax payable or Rs 60000, whichever is less; (b) the total income exceeds twelve lakh rupees and the income-tax payable on such total income exceeds the amount by which the total income is in excess of twelve lakh rupees, an amount equal to the amount by which the income-tax payable on such total income is in excess of the amount by which the total income exceeds twelve lakh rupees. (3) The deduction under sub-section (2), shall not exceed income-tax payable as per the rates provided in section 202(1)."
note = "Sub-section (3) caps the rebate at the tax computed on slab rates, so it never reduces the 20% / 12.5% special-rate tax on capital gains. PLAN §6 open item 7 resolved."

[[rebate]]
id = "rebate_old_regime"
regime = "old"
effective_from = 2026-04-01
income_limit = 500000.0
max_rebate = 12500.0
section_new = "156(1)"
source_url = "https://egazette.gov.in/WriteReadData/2025/265620.pdf"
source_title = "Income-tax Act, 2025, s.156(1) (Gazette p.186): 100% of income-tax payable or Rs 12500, whichever is less, if total income does not exceed Rs 500000"
verification = "primary"
verified_on = 2026-10-06
note = "Sub-section (1) refers to income-tax chargeable on the total income, with no slab-only cap: applied against the whole tax here. Not tested against an authority; the investor's case rarely reaches it."

