# S80 (v2 core). One switch for the whole close loop; the numbers below are the rails and the baseline's parameters (the doc's defaults; his to change).
[core]
on = true                     # false: the loop does nothing and the v1 paper team (missions) works as before
retire_missions = true        # true while the loop is on: manager.tick opens no mission (bookkeeping, fills and scoring go on)
kill = false                  # THE kill switch: true stops all trading and all AI sessions (the book, scoring and data collection go on)
advisors_off = true           # true while the loop is on: no readers, brain passes, mission scans or file investigations, and the review and companion jobs skip (nothing is deleted)

[rails]
turnover_day = 0.10           # at most this share of the book's value traded in a session
turnover_month = 0.40         # ... and in a calendar month
min_trade_rupees = 2000.0     # a smaller order is not worth its charges
max_cost_share = 0.02         # skip a rebalance trade whose charges plus tax exceed this share of its value (a risk cut is exempt)

[baseline]
band_pts = 1.5                # rebalance a name only when it is this many points of the book away from its target weight
vol_window = 250              # sessions of daily returns for the risk model (shrunk covariance)
gauge_drawdown = 0.10         # the fall gauge fires when the Nifty 500 is this far below its 252-session high ...
gauge_below_ma = 200          # ... and below its moving average of this many sessions
gauge_cut = 0.25              # ... then the equity class is cut by this share, moved to cash, until the gauge clears

[baseline_v2]
# S81 (A48): the baseline of the close loop: core ETFs (index, gold, international) plus the held longterm names. THE SYSTEM'S STARTING TARGET (his to change); the strategist's
# adopted allocation replaces it (A49). Core + longterm + swing = 100; gold and international are part of the core, as percent of the whole book.
version = "v2"                # "v1" = the S80 baseline (trades only names already held): the safe fallback
core_pct = 60.0
longterm_pct = 35.0
swing_pct = 5.0               # held back for the swing sleeve (cash until it trades)
gold_pct = 10.0
international_pct = 10.0
index_etfs = ["MONIFTY500", "NIFTYBEES", "JUNIORBEES"]   # Nifty 500, Nifty 50 and Nifty Next 50 index ETFs (the store knows all three; each at most the 35% ETF rail, so three let the whole book sit in the index)
gold_etfs = ["GOLDBEES"]
international_etfs = ["MON100"]              # Nasdaq 100 listed in India; subject to a premium-to-NAV rail (B8)
swing_reserve = true
index_fallback = true         # A50b: when the current allocation fails the index rule in the lab and holding the index passes, the system owns the index (set false to keep the starting split regardless)

[probation]
# S81 (A50): a variant that clears the history screen and the once-only 2018-2021 check trades a satellite slice of this share of the book at once; the slice grows while its
# live record is not worse than the champion's over the sessions below, and is withdrawn when it is worse.
start_share = 0.05
steps = [0.05, 0.10, 0.20]
sessions_to_grow = [20, 40]
max_total_share = 0.20
tolerance = 0.002             # a live record this far behind the champion's stand-in still counts as "not worse"
min_sessions_to_judge = 10

[strategist]
on = true                     # the weekly and triggered lab sessions (Opus); needs the app, a key and room in the cap
throttle_after = "2026-12-09" # A55: the budget-halving rules below are recorded but NOT applied before this date (release 2026-11-10 plus 28 days)
session_rupees = 300.0        # one session's most (the doc's 70% of the cap is about Rs 1,750 a month); halved after a session that ran no lab run, until one does
min_session_rupees = 40.0     # under this the session does not start
weekly_days = 7
max_turns = 18
model = "claude-opus-5-5"
weeks_to_win = 8              # after this many weeks with no AI-written challenger beating the baseline the strategist's budget halves and the system tells him

[checker]
on = true                     # Sonnet's pass-or-veto on big trades (phase 3)
big_trade_share = 0.05        # a trade of this share of the book or more gets the check
model = "claude-sonnet-5-5"

[tactical]
on = true                     # the strategist's same-day views (phase 3), inside a budget that is a share of the book
start_share = 0.10
high_share = 0.20             # after the views have beaten the policy over views_to_judge scored views
low_share = 0.05              # after a poor record
views_to_judge = 20

# S81 B4 (A51): the exit manager and tax selling (core/exits.py). Defaults by sleeve, written down and HIS TO CHANGE. Numbers that are law (the yearly long-term
# exemption, the rates) are NOT here: they come from the tax engine's dated rows (configs/tax/*.toml).
[exits]
on = true
guard_days = 21               # never sell a winner (a gain, short-term now) within this many days before it turns long-term (12 months), unless its stop fires
guard_thesis_override = 0.75  # ... a thesis-break event at or above this severity (0 to 1) also overrides the guard
thesis_severity = 0.75        # an event on a held name at or above this severity breaks its thesis
thesis_kinds = ["fraud", "default", "auditor_resignation", "guidance_cut", "regulatory_action", "rating_downgrade", "results_miss", "promoter_selling", "pledge_invoked", "delisting", "insolvency"]
trim_over_pts = 0.5           # a rail trim starts when a name or sector is this many points over its rail
trim_buffer_pts = 1.0         # ... and brings it this many points under the rail, so it is not trimmed again next week
min_trim_rupees = 2000.0
stop_vol_window = 250         # sessions of daily returns for a stock's own volatility (annualised)
fallback_vol = 0.30           # a name with too little history (the same stated, deliberately high number the risk model uses)
harvest_quarter_months = [1, 2, 3]   # the last quarter of the financial year: the exemption may be booked in full
harvest_off_quarter_share = 0.34     # outside that quarter, at most this share of the yearly exemption is booked (the rest waits for the quarter)
harvest_margin = 0.90         # book at most this share of the room left (the fill is at the next close; the price may move)
harvest_min_gain = 5000.0     # a harvest smaller than this (rupees of gain) is not worth its charges
harvest_cost_multiple = 3.0   # the tax a harvest is expected to save must be at least this many times its round-trip charges
harvest_max_book_share = 0.05 # at most this share of the book is sold for harvesting at one close
loss_harvest = true
loss_min_saving = 1000.0      # a loss harvest must save at least this much tax this year (rupees)
rebuy = true                  # harvest sales are bought back at the NEXT session (never the same day); false: the sale stands

[exits.core]                  # index, gold and international ETFs: no stop, rebalance only (plus harvesting, trims and the 12-month guard)
stop = false
target_reward = 0.0
time_stop_days = 0
thesis_break = false

[exits.longterm]              # stock picks held months to years: a stop at a risk-sized distance from the stock's own volatility, no target, no time stop, thesis break on
stop = true
stop_sigmas = 2.0             # stop distance = this many standard deviations of the stock's move over stop_horizon_days (its own annual volatility scaled)
stop_horizon_days = 63
stop_min_pct = 0.12           # ... never closer than this (a share of the price) ...
stop_max_pct = 0.35           # ... nor further than this
target_reward = 0.0           # 0 = no target
time_stop_days = 0            # 0 = no time stop
thesis_break = true

[exits.swing]                 # days to weeks: a stop, a target (a multiple of the stop distance), a time stop in calendar days, thesis break on
stop = true
stop_sigmas = 2.0
stop_horizon_days = 10
stop_min_pct = 0.04
stop_max_pct = 0.12
target_reward = 2.0           # target = entry + this many times the stop distance
time_stop_days = 21
thesis_break = true

[exits.score]
horizons = [20, 60]           # sessions after the sale at which it is scored against holding
min_n = 20                    # under this many scored sales a rate is a count, not a conclusion
swing_grow_min_excess_pct = 0.0   # the swing sleeve grows when its scored sales beat holding (after tax) by more than this on average, from min_n sales
# S81 (A54, the market-hours rhythms). A paper fill at the live quote, never better than the quote: the price is worse by at least half the modelled spread plus slippage.
# MODEL `liquidity_v1` (an assumption, stated; his to change once a real fill record exists to calibrate it against):
#   adv        the name's average traded value (close x volume, summed over the minute bars of each session) over its last `adv_days` sessions
#   half_spread_bps   falls on a log scale from `half_spread_illiquid_bps` (adv <= illiquid_adv_rupees) to `half_spread_liquid_bps` (adv >= liquid_adv_rupees)
#   slippage_bps      impact_bps * sqrt(order value / adv), never under min_slippage_bps (the square-root impact law; it grows with the order's share of turnover)
#   price      quote x (1 + (half_spread_bps + slippage_bps) / 10000) for a buy, x (1 - ...) for a sell, rounded to the paisa AGAINST the order
#   unknown    a name with no minute history is charged `unknown_half_spread_bps` and a participation of `unknown_participation`
[fills]
adv_days = 20
liquid_adv_rupees = 1000000000.0      # Rs 100 crore a day: the tightest spread
illiquid_adv_rupees = 10000000.0      # Rs 1 crore a day: the widest spread
half_spread_liquid_bps = 1.0
half_spread_illiquid_bps = 25.0
impact_bps = 25.0
min_slippage_bps = 0.5
unknown_half_spread_bps = 15.0
unknown_participation = 0.01
max_participation = 0.10              # an order above this share of a day's turnover is flagged (the model is extrapolating)

# The session loop (core/session.py), every `every_minutes` while the market is open (a job in the app; it needs a Kite login, else it says so once and does only the work that needs no quotes).
[session]
on = true
every_minutes = 5
no_entry_minutes = 15                 # no swing entry or tactical buy in the first 15 minutes of the session (the opening spike); a stop fires at any time
vwap_band = 0.005                     # an entry only within 0.5% of the day's VWAP (not chasing a spike)
volume_fraction = 0.5                 # ... and only when the last `volume_minutes` minutes trade at least this fraction of the name's typical minute volume
volume_minutes = 5
typical_days = 20                     # sessions that make the typical minute volume (09:30-15:00)
views_in_session = true               # the tactical views are carried out in session (the close loop then does not buy them a second time)
thesis_min_severity = "high"          # the fallback thesis-break rule (used only if pflab.core.exits has no check_thesis): a filing of this severity on a held name sells it
fallback_stop_pct = 8.0               # the fallback exit plan (used only while pflab.core.exits is missing): stop, target, time stop of a position the session opened
fallback_target_pct = 15.0
fallback_time_sessions = 20
report_at = "15:45"                   # the self-report on Telegram after the close
# S81 B8 phase A (A53): the premium-to-NAV rail on India-listed international ETFs (core/premium.py). No NEW buying of such an ETF while it trades above its AMFI NAV by more than
# the limit (the overseas-investment limits stop unit creation, so the price floats above NAV: docs/US_LEG_S81.md section 5). Selling is never blocked. A judgement, not a measured
# optimum (his to change): the best-behaved ETF of the set ran 2-5% over NAV in Sep-Oct 2026, the rest 15% to 235%; NAV timing alone gives about +/-1%.
[premium]
on = true
max_premium_pct = 2.0         # no new buying at or above this premium
taper_from_pct = 1.0          # between this and the limit the purchase is scaled down linearly to zero
max_nav_age_days = 5          # a NAV older than this is "unknown"
unknown = "skip"              # skip: no buying while the premium is unknown; allow: buy as the policy says
classes = ["international"]   # the policy classes held to the limit; add "gold" to hold gold ETFs to it too (they ran 5-12% over NAV in Oct 2025 and Jan 2026: secondary sources)

# S81 B8 phase B (A53): the paper US sub-book (src/pflab/us/), USD, on the US close processed in the IST morning. OFF until the coordinator's loop and his yes: nothing else depends on it.
[us]
on = true
start_share = 0.05            # the sub-book starts as this share of the system's book (rupees at the start FX rate); it is paper money (his to change)
start_inr_fallback = 100000.0 # when the system's book is not readable (rupees)
universe = ["SPY", "QQQ", "XLC", "XLY", "XLP", "XLE", "XLF", "XLV", "XLI", "XLB", "XLRE", "XLK", "XLU"]   # the ETFs data/us already collects
invested_share = 0.95         # the baseline holds this share of the sub-book in the universe (equal weights), the rest in cash
deploy_turnover_day = 1.0     # while less than half of invested_share is invested (a fresh account) the day's turnover cap is this share of the sub-book, and the monthly cap is not applied
settle_minutes = 30           # a session counts as closed this long after its close (the daily bar is final)
slippage_bps = 5.0            # ESTIMATE: a buy fills this much above the next open, a sell this much below
min_trade_usd = 25.0
band_pts = 1.5                # rebalance a name only when it is this many points of the sub-book from its target
w8ben = true                  # a valid W-8BEN is on file: US dividend withholding 25% (the treaty rate for an individual); false: 30%
