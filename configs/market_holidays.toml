# NSE equity-segment trading holidays that fall on weekdays (weekends are closed anyway).
# Used by the conductor (S53) to know the market's mode and when the next session opens.
#
# Source: NSE's 2026 list as reproduced by brokers and funds (bajajbroking.in/nse-holidays, cleartax.in/s/nse-holidays-2026,
# tatamutualfund.com/blogs/nse-holidays-2026), read 2026-10-20; the NSE circular itself was not read.
# verified = "bhavcopy": no NSE bhavcopy exists for that weekday in PFLAB_DATA_DIR/bhavcopy (checked 2026-10-20), so the
# market really was shut. verified = "lists": a future date, the same in every list read.
# Next year's list is published by NSE in December: add it here (the conductor warns from 1 December when it is missing).

[meta]
checked_on = 2026-10-20
