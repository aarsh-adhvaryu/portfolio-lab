# NYSE market holidays and early closes, 2026 and 2027, exactly as NYSE's page lists them.
# Source: https://www.nyse.com/trade/hours-calendars , read 2026-10-27. Core session 9:30 to 16:00 America/New_York (13:00 on an
# early-close day). The market follows US daylight saving (clocks change on 2026-11-01 and 2027-03-14), so the IST time of the
# open moves by an hour: conductor/us_calendar.py computes it from the zone, never from a fixed offset.
# Next year's list: NYSE publishes it ahead; add it here (the system warns from 1 December when the next year is missing).

