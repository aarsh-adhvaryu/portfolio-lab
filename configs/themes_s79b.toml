# S79b item 15b: the themes the sentiment tool reads, the price proxies their sensitivity is measured against, and the calendar of scheduled shocks.
# A theme is a config entry: keywords (the headline pre-filter), `gkg_codes` (GDELT's own theme codes, matched as substrings of an article's theme list),
# `industries` (a SECTOR PRIOR: sector-map labels that are taken to carry the theme before any beta is measured), `proxies` (keys of [proxy.*]; the first is
# the PRIMARY proxy, fixed here before any run) and `markets`. `status = "live"` themes run; a stub (`status = "proposed"`) is never read by the tool:
# the agenda may propose one (sentiment.themes.propose_stub writes a stub file for the lead), the lead turns it live by editing this file.
# Nothing here is a number the model makes: the model only names a theme and a tone class for a headline; code computes every figure.

[theme.ai_tech_regulation]
label = "AI and tech regulation"
status = "live"
markets = ["IN", "US"]
keywords = ["artificial intelligence", " ai ", "chip export", "export control", "semiconductor", "antitrust", "big tech", "data protection", "tech regulation", "digital services", "software export", "gpu", "openai", "nvidia"]
gkg_codes = ["EPU_POLICY_REGULATORY", "SOC_EMERGINGTECH", "ARTIFICIAL_INTELLIGENCE", "CYBER", "WB_133_INFORMATION_AND_COMMUNICATION_TECHNOLOGIES"]
industries = ["it", "information technology", "software", "computers"]
proxies = ["nasdaq", "semis"]
gdelt_groups = ["tech", "regulation"]

[theme.oil_middle_east]
label = "Oil and the Middle East"
status = "live"
markets = ["IN", "US"]
keywords = ["crude", "brent", "oil price", "opec", "middle east", "iran", "israel", "gaza", "red sea", "strait of hormuz", "saudi", "pipeline", "refinery", "fuel price"]
gkg_codes = ["ENV_OIL", "ECON_OILPRICE", "FUELPRICES", "ARMEDCONFLICT", "EPU_CATS_NATIONAL_SECURITY"]
industries = ["oil", "gas", "petrol", "refin", "aviation", "airline", "paint"]
proxies = ["crude", "usdinr"]
gdelt_groups = ["energy", "conflict"]

[theme.tariffs_trade]
label = "Tariffs and trade"
status = "live"
markets = ["IN", "US"]
keywords = ["tariff", "trade war", "trade deal", "trade agreement", "export duty", "import duty", "customs duty", "sanction", "wto", "trade deficit", "anti-dumping"]
gkg_codes = ["TRADE_DISPUTE", "ECON_TRADE", "EPU_CATS_TRADE", "ECON_CUSTOMS", "SANCTION"]
industries = ["textile", "gems", "jewellery", "leather", "chemicals", "auto ancillar", "pharma"]
proxies = ["usdinr", "dollar"]
gdelt_groups = ["trade"]

[theme.rates_central_banks]
label = "Rates and central banks"
status = "live"
markets = ["IN", "US"]
keywords = ["rate cut", "rate hike", "interest rate", "repo rate", "fed ", "federal reserve", "rbi", "monetary policy", "inflation", "bond yield", "treasury yield", "fomc", "mpc"]
gkg_codes = ["ECON_INTEREST_RATES", "ECON_INFLATION", "EPU_POLICY_MONETARY", "ECON_DEBT", "CENTRAL_BANK"]
industries = ["bank", "finan", "nbfc", "insurance", "housing", "real estate"]
proxies = ["us10y", "usdinr"]
gdelt_groups = ["finance"]

[theme.domestic_policy_budget]
label = "Domestic policy and the Budget"
status = "live"
markets = ["IN", "US"]
keywords = ["budget", "gst", "capital gains tax", "fiscal deficit", "disinvestment", "subsidy", "election", "lok sabha", "parliament", "stimulus", "tax cut", "government spending", "shutdown"]
gkg_codes = ["EPU_POLICY_TAX", "EPU_POLICY_SPENDING", "EPU_POLICY_GOVERNMENT", "ECON_TAXATION", "USPEC_POLICY1"]
industries = ["infra", "construction", "capital goods", "defence", "power", "railway", "cement"]
proxies = ["nifty", "us10y"]
gdelt_groups = ["regulation", "finance"]

# --- proxies: the price series a theme's sensitivity is measured against. `files` = candidates in order (relative to PFLAB_DATA_DIR), the first that
# exists is used; `col` = the price column; `lag` = how many proxy sessions earlier than the stock's own day the proxy return is paired with (1 for series
# that settle after the Indian close: US closes, Brent futures; 0 for same-day series).
[proxy.crude]
label = "Brent crude"
files = ["global/BRENT_FUT.parquet", "macro/BRENT.parquet"]
cols = ["value", "close"]
lag = 1
[proxy.nasdaq]
label = "Nasdaq"
files = ["global/US_NASDAQ.parquet", "macro/US_NASDAQ.parquet"]
cols = ["value", "close"]
lag = 1
[proxy.semis]
label = "Semiconductors (SOX)"
files = ["global/US_SOX.parquet", "global/SOX.parquet", "global/US_SEMIS_SOX.parquet", "global/US_SOXX.parquet"]
cols = ["close", "value"]
lag = 1
[proxy.usdinr]
label = "USD/INR"
files = ["global/FX_USDINR.parquet", "macro/USDINR.parquet"]
cols = ["value", "close"]
lag = 0
[proxy.us10y]
label = "US 10-year yield"
files = ["global/US_10Y_YIELD.parquet", "macro/US10Y.parquet"]
cols = ["value", "close"]
lag = 1
[proxy.dollar]
label = "Dollar index"
files = ["global/DOLLAR_INDEX.parquet", "macro/USD_BROAD.parquet"]
cols = ["close", "value"]
lag = 1
[proxy.nifty]
label = "Nifty 50"
files = ["indices/NIFTY50_PRICE.parquet"]
cols = ["close"]
lag = 0

# --- the calendar of scheduled shocks. Only dates with a recorded source are `verified = true`; the rest say `verified = false` and name what would verify
# them. `utc` is the moment the news is public ("approx" events: the reaction session is the first one on or after the next calendar day). The calendar
# gets a code-written SCENARIO NOTE before each event and a SURPRISE measure after it (sentiment/calendar.py).
[[event]]
id = "us_midterms_2026"
date = "2026-11-03"
utc = "2026-11-04T03:00"
kind = "election"
label = "US midterm elections (Congress)"
themes = ["domestic_policy_budget", "tariffs_trade", "rates_central_banks"]
markets = ["IN", "US"]
verified = true
source = "Election Day is by US federal law the Tuesday after the first Monday of November (2 U.S.C. 7): 2026-11-03. Results time is approximate."

